<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220">
<title>Mis Tareas · Mini</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-32.png" type="image/png">
<style>
  /* ============================================================
     Mis Tareas · Mini (rama móvil). Un solo archivo, sin dependencias.
     Mismo esquema de datos que el escritorio (ver normalizar()).
     ============================================================ */
  :root{
    --azul:#2563eb; --azul-suave:#eff6ff;
    --violeta:#7c3aed; --violeta-suave:#f3effe;
    --verde:#059669; --verde-suave:#e8faf3;
    --ambar:#d97706; --ambar-suave:#fff6e0;
    --rojo:#dc2626; --rojo-suave:#fdeeee;
    --texto:#0f172a; --muted:#475569; --soft:#94a3b8;
    --borde:#e2e8f0; --fondo:#f8fafc; --tarjeta:#ffffff;
    --sombra:0 1px 2px rgba(15,23,42,.05);
    --sombra-lg:0 10px 30px rgba(15,23,42,.16);
    --radio:14px; --radio-sm:11px;
    --barra-alto:60px;
  }
  :root[data-tema="oscuro"]{
    --azul:#60a5fa; --azul-suave:#1e2a45;
    --violeta:#a78bfa; --violeta-suave:#2a2344;
    --verde:#34d399; --verde-suave:#122b22;
    --ambar:#fbbf24; --ambar-suave:#332a12;
    --rojo:#f87171; --rojo-suave:#3b1a1a;
    --texto:#e2e8f0; --muted:#94a3b8; --soft:#64748b;
    --borde:#334155; --fondo:#0b1220; --tarjeta:#111a2c;
    --sombra:0 1px 2px rgba(0,0,0,.4);
    --sombra-lg:0 10px 30px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--fondo);color:var(--texto);font-size:16px;line-height:1.45;
    padding:0 0 calc(var(--barra-alto) + env(safe-area-inset-bottom,0px) + 84px);
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,textarea,select{font:inherit;color:var(--texto)}
  .oculto{display:none !important}

  /* ---------- Cabecera ---------- */
  .cima{
    position:sticky;top:0;z-index:20;background:var(--tarjeta);
    border-bottom:1px solid var(--borde);padding:10px 14px 9px;
    padding-top:calc(10px + env(safe-area-inset-top,0px));
  }
  .cima-fila{display:flex;align-items:center;gap:10px}
  .cima h1{font-size:1.02rem;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
  .cima h1 .logo{width:22px;height:22px;flex:none}
  .cima .espacio{flex:1}
  .icon-btn{
    width:44px;height:44px;border-radius:13px;border:1px solid var(--borde);background:var(--fondo);
    display:inline-flex;align-items:center;justify-content:center;flex:none
  }
  .icon-btn:active{transform:scale(.95)}
  .icon-btn .ico{width:19px;height:19px}
  .recuento{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none}
  .recuento::-webkit-scrollbar{display:none}
  .cuenta{
    flex:none;background:var(--fondo);border:1px solid var(--borde);border-radius:99px;
    padding:4px 11px;font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:5px
  }
  .cuenta b{color:var(--texto);font-weight:800;font-variant-numeric:tabular-nums}
  .cuenta.alerta{background:var(--rojo-suave);border-color:transparent;color:var(--rojo)}
  .cuenta.alerta b{color:var(--rojo)}

  /* ---------- Buscador y etiquetas ---------- */
  .buscar{display:flex;gap:8px;align-items:center;padding:11px 14px 4px}
  .buscar .caja{position:relative;flex:1;display:flex;align-items:center}
  .buscar .caja .ico{position:absolute;left:11px;width:17px;height:17px;color:var(--soft);pointer-events:none}
  .buscar input{
    width:100%;padding:11px 12px 11px 36px;border:1px solid var(--borde);border-radius:12px;
    background:var(--tarjeta);font-size:.94rem
  }
  .buscar select{
    border:1px solid var(--borde);border-radius:12px;background:var(--tarjeta);padding:11px 8px;font-size:.86rem
  }
  .pistas{display:flex;gap:7px;padding:8px 14px 2px;overflow-x:auto;scrollbar-width:none}
  .pistas::-webkit-scrollbar{display:none}
  .pista{
    flex:none;border:1px solid var(--borde);background:var(--tarjeta);border-radius:99px;padding:10px 14px;
    min-height:44px;font-size:.82rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px
  }
  .pista.activa{font-weight:800;color:var(--texto);border-color:var(--azul);background:var(--azul-suave)}
  .pista .punto{width:9px;height:9px;border-radius:50%}

  /* ---------- Secciones ---------- */
  .bloque{padding:14px 14px 0}
  .bloque-titulo{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .bloque-titulo h2{font-size:.96rem;font-weight:800}
  .bloque-titulo .num{
    background:var(--fondo);border:1px solid var(--borde);border-radius:99px;padding:1px 9px;
    font-size:.76rem;color:var(--muted);font-weight:700
  }
  .bloque-titulo .espacio{flex:1}
  .enlace{font-size:.82rem;color:var(--azul);font-weight:700;padding:4px 6px;border-radius:7px}

  /* ---------- Barra de progreso ---------- */
  .progreso-global{background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio);padding:12px 14px;margin:14px 14px 0}
  .progreso-global .fila{display:flex;align-items:baseline;gap:8px}
  .progreso-global .gran{font-size:1.55rem;font-weight:900;color:var(--azul);font-variant-numeric:tabular-nums}
  .progreso-global .det{font-size:.82rem;color:var(--muted)}
  .barra{height:7px;background:var(--fondo);border:1px solid var(--borde);border-radius:99px;margin-top:9px;overflow:hidden}
  .barra>div{height:100%;background:linear-gradient(90deg,var(--verde),#34d399);border-radius:99px;transition:width .45s ease}
  .dias{display:flex;gap:5px;margin-top:11px;align-items:flex-end;height:44px}
  .dias .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .dias .barr{width:100%;background:var(--verde);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
  .dias .lbl{font-size:.6rem;color:var(--soft);font-weight:700}
  .dias .d.hoy .lbl{color:var(--azul)}

  /* ---------- Tarjeta de tarea ---------- */
  .lista{display:flex;flex-direction:column;gap:9px;padding-top:4px}
  .tarea{
    background:var(--tarjeta);border:1px solid var(--borde);border-left:4px solid var(--borde);
    border-radius:var(--radio-sm);padding:11px 12px;box-shadow:var(--sombra);display:flex;gap:11px;align-items:flex-start
  }
  .tarea.vencida{border-color:var(--rojo);background:var(--rojo-suave)}
  .tarea.hecha{opacity:.62}
  .tarea.sel{border-color:var(--azul)}
  /* Zona táctil de 44 px con la caja visual de 30 px dentro */
  .marca{
    width:44px;height:44px;flex:none;margin-left:-9px;margin-top:-6px;
    display:inline-flex;align-items:center;justify-content:center
  }
  .marca .caja{
    width:30px;height:30px;border:2px solid var(--soft);border-radius:10px;
    display:inline-flex;align-items:center;justify-content:center;transition:.12s
  }
  .marca .ico{width:17px;height:17px;color:transparent}
  .marca.on .caja{background:var(--verde);border-color:var(--verde)}
  .marca.on .ico{color:#fff}
  .cuerpo{flex:1;min-width:0}
  .titulo{font-weight:700;font-size:.96rem;word-wrap:break-word}
  .tarea.hecha .titulo{text-decoration:line-through;color:var(--muted)}
  .nota{font-size:.83rem;color:var(--muted);margin-top:3px;white-space:pre-wrap;word-wrap:break-word}
  .insignias{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;align-items:center}
  .ins{
    border-radius:99px;padding:2px 9px;font-size:.72rem;font-weight:800;background:var(--fondo);
    color:var(--muted);border:1px solid var(--borde);display:inline-flex;align-items:center;gap:4px
  }
  .ins .ico{width:12px;height:12px}
  .ins.alta{color:var(--rojo);background:var(--rojo-suave);border-color:transparent}
  .ins.media{color:#b45309;background:var(--ambar-suave);border-color:transparent}
  .ins.baja{color:var(--azul);background:var(--azul-suave);border-color:transparent}
  .ins.hoy{background:var(--ambar);color:#fff;border-color:transparent}
  .ins.venc{background:var(--rojo);color:#fff;border-color:transparent}
  .ins.recur{color:var(--violeta);background:var(--violeta-suave);border-color:transparent}
  .ins.rec{color:#0f766e;background:var(--verde-suave);border-color:transparent}
  .ins.tag{color:#fff;border-color:transparent;font-weight:700}
  .subs{margin-top:8px;display:flex;flex-direction:column;gap:1px}
  .sub{display:flex;gap:9px;align-items:flex-start;font-size:.85rem;color:var(--muted);padding:9px 4px;border-radius:8px;min-height:44px}
  .sub .cuad{
    width:22px;height:22px;flex:none;border:2px solid var(--soft);border-radius:7px;margin-top:-1px;
    display:inline-flex;align-items:center;justify-content:center
  }
  .sub .cuad .ico{width:14px;height:14px;color:transparent}
  .sub.on .cuad{background:var(--verde);border-color:var(--verde)}
  .sub.on .cuad .ico{color:#fff}
  .sub.on span{text-decoration:line-through;color:var(--soft)}
  .sub-prog{font-size:.72rem;color:var(--soft);margin-top:5px;font-variant-numeric:tabular-nums}
  .acciones{display:flex;gap:2px;margin-top:9px;flex-wrap:wrap}
  .acciones button{
    border-radius:10px;padding:10px 12px;min-height:44px;font-size:.8rem;color:var(--muted);
    display:inline-flex;align-items:center;gap:5px
  }
  .acciones button .ico{width:15px;height:15px}
  .acciones button:active{background:var(--fondo)}
  .acciones .mov{
    margin-left:auto;border:1px solid var(--borde);background:var(--fondo);font-weight:700;font-size:.8rem;
    border-radius:10px;padding:9px 9px;min-height:44px;color:var(--muted)
  }

  /* ---------- Calendario (semana) ---------- */
  .cal-cab{display:flex;align-items:center;gap:8px;padding:0 14px;margin-top:14px}
  .cal-cab .rango{font-weight:800;font-size:.95rem;flex:1;text-align:center}
  .cal-dia{padding:0 14px 4px}
  .cal-dia-cab{display:flex;align-items:center;gap:8px;margin:12px 0 6px}
  .cal-dia-cab .nombre{font-size:.8rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .cal-dia-cab.hoy .nombre{color:var(--azul)}
  .cal-dia-cab .num{font-size:.76rem;color:var(--soft);font-weight:700}
  .cal-dia-cab .mas{margin-left:auto;font-size:.78rem;color:var(--azul);font-weight:800;padding:4px 8px;border-radius:8px;background:var(--azul-suave)}
  .sinfecha{margin:14px 14px 0;border:1px dashed var(--borde);border-radius:var(--radio);padding:10px 12px}
  .sinfecha h3{font-size:.78rem;color:var(--soft);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}

  /* ---------- Vacío ---------- */
  .vacia{text-align:center;padding:34px 22px;color:var(--soft)}
  .vacia .ico{width:38px;height:38px;opacity:.5;margin-bottom:8px}
  .vacia p{font-size:.9rem}

  /* ---------- FAB ---------- */
  #fab{
    position:fixed;right:16px;bottom:calc(var(--barra-alto) + env(safe-area-inset-bottom,0px) + 18px);
    width:58px;height:58px;border-radius:19px;background:var(--azul);color:#fff;z-index:35;
    box-shadow:var(--sombra-lg);display:flex;align-items:center;justify-content:center
  }
  #fab:active{transform:scale(.94)}
  #fab .ico{width:26px;height:26px}

  /* ---------- Navegación inferior ---------- */
  #tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--barra-alto) + env(safe-area-inset-bottom,0px));
    padding-bottom:env(safe-area-inset-bottom,0px);background:var(--tarjeta);border-top:1px solid var(--borde);
    display:grid;grid-template-columns:repeat(3,1fr)
  }
  #tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--soft);font-size:.68rem;font-weight:700}
  #tabs button .ico{width:21px;height:21px}
  #tabs button.activa{color:var(--azul)}

  /* ---------- Hoja (formulario) ---------- */
  dialog{
    position:fixed;top:auto;left:0;right:0;bottom:0;margin:0;width:100%;max-width:none;border:none;
    background:var(--tarjeta);color:var(--texto);border-radius:22px 22px 0 0;box-shadow:var(--sombra-lg);
    padding:0;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch
  }
  dialog::backdrop{background:rgba(15,23,42,.55)}
  dialog[open]{animation:sube .22s ease}
  @keyframes sube{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
  .asidero{width:38px;height:4px;border-radius:99px;background:var(--borde);margin:9px auto 2px}
  .hoja{padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px))}
  .hoja h2{font-size:1.06rem;font-weight:800;margin-bottom:12px}
  .campo{margin-bottom:12px}
  .campo>label{display:block;font-size:.78rem;font-weight:800;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
  .campo input,.campo textarea,.campo select{
    width:100%;padding:12px 13px;border:1px solid var(--borde);border-radius:12px;background:var(--fondo)
  }
  .campo textarea{min-height:64px;resize:vertical}
  .doble{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .error-campo{display:none;margin-top:5px;font-size:.78rem;color:var(--rojo);font-weight:700}
  .error-campo.visible{display:block}
  .campo input.con-error{border-color:var(--rojo);outline:2px solid var(--rojo);outline-offset:-2px}
  .chips-form{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip-tag{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 7px 5px 12px;font-size:.8rem;font-weight:700;color:#fff}
  .chip-tag button{border:none;border-radius:50%;width:19px;height:19px;font-size:.72rem;background:rgba(255,255,255,.85);color:#333;padding:0;display:inline-flex;align-items:center;justify-content:center}
  .chip-tag .color{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.9);padding:0}
  .fila-sub{display:flex;gap:9px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--borde)}
  .fila-sub .cuad{width:22px;height:22px;flex:none;border:2px solid var(--soft);border-radius:7px;display:inline-flex;align-items:center;justify-content:center}
  .fila-sub .cuad .ico{width:13px;height:13px;color:transparent}
  .fila-sub.on .cuad{background:var(--verde);border-color:var(--verde)}
  .fila-sub.on .cuad .ico{color:#fff}
  .fila-sub .txt{flex:1;font-size:.9rem;word-wrap:break-word}
  .fila-sub.on .txt{text-decoration:line-through;color:var(--soft)}
  .fila-sub .x{color:var(--soft);padding:6px}
  .add-sub{display:flex;gap:8px;margin-top:9px}
  .add-sub input{flex:1;padding:11px 12px;border:1px solid var(--borde);border-radius:12px;background:var(--fondo)}
  .prioridad-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .prioridad-seg button{
    border:1px solid var(--borde);background:var(--fondo);border-radius:11px;padding:11px 6px;
    font-size:.85rem;font-weight:700;color:var(--muted)
  }
  .prioridad-seg button.on-alta{background:var(--rojo);border-color:var(--rojo);color:#fff}
  .prioridad-seg button.on-media{background:var(--ambar);border-color:var(--ambar);color:#fff}
  .prioridad-seg button.on-baja{background:var(--azul);border-color:var(--azul);color:#fff}
  .botones{display:flex;gap:9px;margin-top:16px}
  .btn{border:1px solid var(--borde);background:var(--fondo);border-radius:13px;padding:13px 15px;font-weight:700;font-size:.92rem;flex:1}
  .btn.primario{background:var(--azul);border-color:var(--azul);color:#fff;flex:2}
  .btn.peligro{background:transparent;border-color:var(--rojo);color:var(--rojo);flex:none;width:56px}
  .sugerencias{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .sugerencias button{
    border:1px solid var(--borde);background:var(--fondo);border-radius:99px;padding:8px 13px;min-height:40px;
    font-size:.78rem;font-weight:700;color:var(--muted)
  }

  /* ---------- Menú de copia (hoja secundaria) ---------- */
  .opcion{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 4px;
    border-bottom:1px solid var(--borde);font-size:.93rem;font-weight:600
  }
  .opcion:last-child{border-bottom:none}
  .opcion .ico{width:19px;height:19px;color:var(--azul);flex:none}
  .opcion small{display:block;font-size:.76rem;color:var(--soft);font-weight:500;margin-top:2px}

  /* ---------- Aviso (toast) ---------- */
  #aviso{
    position:fixed;left:12px;right:12px;bottom:calc(var(--barra-alto) + env(safe-area-inset-bottom,0px) + 88px);
    background:#1e293b;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;
    box-shadow:var(--sombra-lg);transform:translateY(200px);transition:transform .28s;z-index:40;font-size:.9rem
  }
  #aviso.visible{transform:none}
  #aviso button{background:var(--tarjeta);color:var(--texto);border-radius:9px;padding:7px 13px;font-weight:800;font-size:.82rem}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s !important;transition-duration:.001s !important}
  }
</style>
</head>
<body>
<div class="cima">
  <div class="cima-fila">
    <h1>
      <svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs><linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient></defs>
        <rect width="512" height="512" rx="110" fill="url(#lg1)"/>
        <circle cx="220" cy="220" r="160" fill="#fff"/>
        <line x1="220" y1="220" x2="160" y2="170" stroke="#1e293b" stroke-width="26" stroke-linecap="round"/>
        <line x1="220" y1="220" x2="305" y2="180" stroke="#1e293b" stroke-width="18" stroke-linecap="round"/>
        <circle cx="220" cy="220" r="20" fill="#1e293b"/>
        <circle cx="370" cy="370" r="105" fill="#059669" stroke="#fff" stroke-width="10"/>
        <path d="M 320 370 L 358 410 L 425 335" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Mis Tareas <span style="font-weight:500;color:var(--soft);font-size:.8rem">mini</span>
    </h1>
    <span class="espacio"></span>
    <button class="icon-btn" id="btnCopias" title="Copias de seguridad" aria-label="Copias de seguridad"></button>
    <button class="icon-btn" id="btnTema" title="Cambiar tema" aria-label="Cambiar tema"></button>
  </div>
  <div class="recuento" id="recuento"></div>
</div>

<div class="buscar">
  <span class="caja"><span id="icoBuscar"></span><input type="search" id="buscar" placeholder="Buscar tareas…" autocomplete="off"></span>
  <select id="filtroPrio" aria-label="Filtrar por prioridad">
    <option value="">Toda</option>
    <option value="alta">Alta</option>
    <option value="media">Media</option>
    <option value="baja">Baja</option>
  </select>
</div>
<div class="pistas" id="pistas"></div>

<main id="app"></main>

<button id="fab" title="Nueva tarea" aria-label="Nueva tarea"></button>

<nav id="tabs">
  <button id="tabHoy" class="activa" aria-label="Vista Hoy"></button>
  <button id="tabLista" aria-label="Vista Lista"></button>
  <button id="tabSemana" aria-label="Vista Semana"></button>
</nav>

<dialog id="hoja">
  <div class="asidero"></div>
  <form class="hoja" id="formulario">
    <h2 id="hojaTitulo">Nueva tarea</h2>
    <div class="campo">
      <label for="fTitulo">Título</label>
      <input id="fTitulo" type="text" required maxlength="200" placeholder="¿Qué hay que hacer?">
    </div>
    <div class="campo">
      <label for="fDesc">Descripción</label>
      <textarea id="fDesc" rows="2" maxlength="1200" placeholder="Detalles, notas…"></textarea>
    </div>
    <div class="campo">
      <label>Prioridad</label>
      <div class="prioridad-seg" id="prioSeg">
        <button type="button" data-p="alta">Alta</button>
        <button type="button" data-p="media">Media</button>
        <button type="button" data-p="baja">Baja</button>
      </div>

<script>
"use strict";
/* ================================================================
   Mis Tareas · Mini — móvil (navegador o APK con Capacitor).
   El esquema es el del escritorio: si cambias normalizar() allí,
   cámbialo aquí también. No hay backend: localStorage puro.
   ================================================================ */
const esNativo = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

const CLAVE = "mis-tareas-v2";                 // mismo nombre que el escritorio
const CLAVE_TEMA = "mis-tareas-tema";
const CLAVE_VISTA = "mis-tareas-vista-mini";
const CLAVE_AVISADOS = "mis-tareas-avisados-mini";
const ESTADOS = [
  {id:"pendiente", nombre:"Pendiente", color:"#2563eb"},
  {id:"progreso", nombre:"En progreso", color:"#7c3aed"},
  {id:"pausada", nombre:"Pausada", color:"#d97706"},
  {id:"completada", nombre:"Completada", color:"#059669"}
];
const PALETA = ["#dc2626","#d97706","#059669","#2563eb","#7c3aed","#db2777","#0d9488","#ea580c","#4f46e5","#65a30d"];
const DIAS_LARGO = ["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
const DIAS_CORTO = ["L","M","X","J","V","S","D"];
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

const CAMINOS_ICO = {
  mas:'<path d="M12 5v14"/><path d="M5 12h14"/>',
  cerrar:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  reloj:'<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>',
  calendario:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M3 11h18"/>',
  hoy:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M3 11h18"/><circle cx="12" cy="16" r="2.5"/>',
  lista:'<path d="M3 6h13"/><path d="M3 12h13"/><path d="M3 18h13"/><path d="M19 6h.01"/><path d="M19 12h.01"/><path d="M19 18h.01"/>',
  semana:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 11h18"/><path d="M9 11v10"/>',
  repetir:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  campana:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  lapiz:'<path d="M17 3a2.8 2.8 0 1 1 4 4L7 21l-5 1 1-5z"/>',
  papelera:'<path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  copiar:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  buscar:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>',
  bandeja:'<path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>',
  luna:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  sol:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.3 17.7-1.4 1.4"/><path d="m19.1 4.9-1.4 1.4"/>',
  guardar:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  abrir:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 8 5-5 5 5"/><path d="M12 3v12"/>',
  texto:'<path d="M4 7V5h16v2"/><path d="M9 20h6"/><path d="M12 5v15"/>',
  atras:'<path d="m15 18-6-6 6-6"/>',
  adelante:'<path d="m9 18 6-6-6-6"/>'
};
function ico(nombre){
  return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
    + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(CAMINOS_ICO[nombre]||"")+'</svg>';
}
function esc(s){ const d=document.createElement("div"); d.textContent=String(s==null?"":s); return d.innerHTML; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function hoyStr(){ const d=new Date(); return aStr(d); }
function aStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseFecha(s){ const p=String(s).split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function diasHasta(f){ return Math.round((parseFecha(f)-parseFecha(hoyStr()))/86400000); }
function esVencida(t){ return t.estado!=="completada" && t.fecha && t.fecha<hoyStr(); }
// Clave AAAA-MM-DD en hora LOCAL a partir del ISO UTC (si no, un guardado de noche cae en el día incorrecto)
function claveLocalDe(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return isNaN(d.getTime()) ? String(iso).slice(0,10) : aStr(d);
}
function diaSemana(d){ return (d.getDay()+6)%7; } // 0 = lunes
function fechaCorta(s){ const d=parseFecha(s); return d.getDate()+" "+MESES[d.getMonth()]; }
// "Hoy 09:00" / "Mañana 18:30" / "14 nov 09:00" — el ISO crudo queda ilegible en una tarjeta
function recordatorioBonito(r){
  const dia = r.slice(0,10), hora = r.slice(11,16);
  if(dia===hoyStr()) return "Hoy "+hora;
  if(dia===dentroDe(1)) return "Mañana "+hora;
  return fechaCorta(dia)+" "+hora;
}
function dentroDe(n){ const x=new Date(); x.setDate(x.getDate()+n); return aStr(x); }

/* ---------- Esquema (espejo del escritorio) ---------- */
function normalizar(t){
  return {
    id: typeof t.id==="string" ? t.id : uid(),
    titulo: String(t.titulo||"Sin título"),
    descripcion: t.descripcion != null ? t.descripcion : (t.nota || ""),
    estado: ESTADOS.some(e=>e.id===t.estado) ? t.estado : (t.hecha ? "completada" : "pendiente"),
    prioridad: ["alta","media","baja"].includes(t.prioridad) ? t.prioridad : "media",
    fecha: typeof t.fecha==="string" ? t.fecha : "",
    recordatorio: typeof t.recordatorio==="string" ? t.recordatorio : "",
    etiquetas: Array.isArray(t.etiquetas) ? t.etiquetas.filter(e=>typeof e==="string") : [],
    subtareas: Array.isArray(t.subtareas)
      ? t.subtareas.filter(s=>s && typeof s.texto==="string").map(s=>({id:s.id||uid(), texto:s.texto, hecha:!!s.hecha}))
      : [],
    recur: ["diaria","semanal","mensual"].includes(t.recur) ? t.recur : "no",
    creadaEl: typeof t.creadaEl==="number" ? t.creadaEl : Date.now(),
    completadaEl: t.completadaEl || t.hechaEl || null,
    cronometro: {
      segundos: (t.cronometro && typeof t.cronometro==="object" && isFinite(+t.cronometro.segundos)) ? Math.max(0, Math.floor(+t.cronometro.segundos)) : 0,
      activo: false
    }
  };
}
function avanzarFecha(s, recur){
  const d=parseFecha(s);
  do{
    if(recur==="diaria") d.setDate(d.getDate()+1);
    else if(recur==="semanal") d.setDate(d.getDate()+7);
    else if(recur==="mensual") d.setMonth(d.getMonth()+1);
  }while(aStr(d) < hoyStr());
  return aStr(d);
}
function cambiarEstado(t, nuevo){
  const antes = t.estado;
  t.estado = nuevo;
  if(nuevo==="completada" && antes!=="completada"){
    t.completadaEl = new Date().toISOString();
    if(t.recur!=="no"){
      const copia = JSON.parse(JSON.stringify(t));
      copia.id = uid(); copia.estado = "pendiente"; copia.completadaEl = null; copia.creadaEl = Date.now();
      copia.subtareas = copia.subtareas.map(s=>({id:uid(), texto:s.texto, hecha:false}));
      if(t.fecha) copia.fecha = avanzarFecha(t.fecha, t.recur);
      if(t.recordatorio && copia.fecha) copia.recordatorio = copia.fecha + t.recordatorio.slice(10);
      tareas.push(copia);
    }
  }
  if(nuevo!=="completada") t.completadaEl = null;
}
function colorDeTag(tag){
  if(!coloresTag[tag]){
    let h=0; for(const c of tag) h=(h*31+c.charCodeAt(0))>>>0;
    coloresTag[tag] = PALETA[h%PALETA.length];
  }
  return coloresTag[tag];
}

/* ---------- Estado ---------- */
let tareas = [];
let coloresTag = {};
let editandoId = null;
let formTags = [];
let formSubs = [];
let formPrio = "media";
let ultimoBorrado = null;
let vista = { modo:"hoy", busqueda:"", prioridad:"", etiqueta:null };
let calSemanaOffset = 0;

/* ---------- Persistencia (solo localStorage) ---------- */
function cargar(){
  try{
    const d = JSON.parse(localStorage.getItem(CLAVE));
    if(d && Array.isArray(d.tareas)) return { tareas:d.tareas.map(normalizar), coloresTag:d.coloresTag||{} };
    if(Array.isArray(d)) return { tareas:d.map(normalizar), coloresTag:{} };
  }catch(e){ console.warn("Datos ilegibles:", e); }
  return { tareas:[], coloresTag:{} };
}
function guardar(){
  try{ localStorage.setItem(CLAVE, JSON.stringify({tareas, coloresTag})); }
  catch(e){ avisar("No hay espacio para guardar (almacenamiento lleno)."); }
}

/* ---------- Filtros ---------- */
function filtrar(lista){
  let l = lista.slice();
  if(vista.etiqueta) l = l.filter(t=>t.etiquetas.includes(vista.etiqueta));
  if(vista.prioridad) l = l.filter(t=>t.prioridad===vista.prioridad);
  if(vista.busqueda){
    const q = vista.busqueda.toLowerCase();
    l = l.filter(t=>(t.titulo+" "+t.descripcion+" "+t.etiquetas.join(" ")).toLowerCase().includes(q));
  }
  const peso = {alta:0, media:1, baja:2};
  l.sort((a,b)=> (peso[a.prioridad]-peso[b.prioridad]) || ((a.fecha||"9999")<(b.fecha||"9999")?-1:1));
  return l;
}

/* ---------- Render ---------- */
function tarjeta(t){
  const subs = t.subtareas||[];
  const hechas = subs.filter(s=>s.hecha).length;
  const pct = subs.length ? Math.round(hechas/subs.length*100) : 0;
  let insignias = '<span class="ins '+t.prioridad+'">'+(t.prioridad==="alta"?"Alta":t.prioridad==="media"?"Media":"Baja")+'</span>';
  if(t.fecha){
    if(esVencida(t)) insignias += '<span class="ins venc">'+ico("reloj")+'Vencida · '+esc(fechaCorta(t.fecha))+'</span>';
    else if(diasHasta(t.fecha)===0 && t.estado!=="completada") insignias += '<span class="ins hoy">'+ico("calendario")+'Hoy</span>';
    else if(diasHasta(t.fecha)===1) insignias += '<span class="ins">'+ico("calendario")+'Mañana</span>';
    else insignias += '<span class="ins">'+ico("calendario")+'<span style="font-variant-numeric:tabular-nums">'+esc(fechaCorta(t.fecha))+'</span></span>';
  }
  if(t.recur!=="no") insignias += '<span class="ins recur">'+ico("repetir")+(t.recur==="diaria"?"Diaria":t.recur==="semanal"?"Semanal":"Mensual")+'</span>';
  if(t.recordatorio) insignias += '<span class="ins rec">'+ico("campana")+esc(recordatorioBonito(t.recordatorio))+'</span>';
  t.etiquetas.forEach(e=>{ insignias += '<span class="ins tag" style="background:'+colorDeTag(e)+'"># '+esc(e)+'</span>'; });

  const sig = {pendiente:"En progreso", "progreso":"Pausada", pausada:"Pendiente", completada:"Pendiente"}[t.estado];
  const estadoOpciones = ESTADOS.map(e=>'<option value="'+e.id+'"'+(e.id===t.estado?" selected":"")+'>'+e.nombre+'</option>').join("");
  const div = document.createElement("div");
  div.className = "tarea"+(t.estado==="completada"?" hecha":"")+(esVencida(t)?" vencida":"");
  div.dataset.id = t.id;
  div.style.borderLeftColor = (ESTADOS.find(e=>e.id===t.estado)||{}).color || "";
  div.innerHTML =
      '<button class="marca'+(t.estado==="completada"?" on":"")+'" data-act="completar" aria-label="'+(t.estado==="completada"?"Reabrir":"Completar")+'">'
        + '<span class="caja">'+ico("check")+'</span></button>'
    + '<div class="cuerpo">'
      + '<div class="titulo">'+esc(t.titulo)+'</div>'
      + (t.descripcion ? '<div class="nota">'+esc(t.descripcion)+'</div>' : '')
      + '<div class="insignias">'+insignias+'</div>'
      + (subs.length
          ? '<div class="subs">'+subs.map(s=>'<button class="sub'+(s.hecha?" on":"")+'" data-act="sub" data-sub="'+s.id+'">'
              + '<span class="cuad">'+ico("check")+'</span><span>'+esc(s.texto)+'</span></button>').join("")+'</div>'
            + '<div class="sub-prog">Subtareas '+hechas+'/'+subs.length+' · '+pct+'%</div>'
          : '')
      + '<div class="acciones">'
        + '<button data-act="editar">'+ico("lapiz")+'Editar</button>'
        + '<button data-act="duplicar" aria-label="Duplicar">'+ico("copiar")+'</button>'
        + '<button data-act="borrar" aria-label="Borrar">'+ico("papelera")+'</button>'
        + '<select class="mov" data-act="estado" aria-label="Mover a otro estado">'+estadoOpciones+'</select>'
      + '</div>'
    + '</div>';
  div.querySelector('[data-act="completar"]').onclick = ()=>{
    cambiarEstado(t, t.estado==="completada" ? "pendiente" : "completada");
    vibrar(); guardar(); render();
  };
  div.querySelector('[data-act="estado"]').onchange = (ev)=>{
    cambiarEstado(t, ev.target.value); guardar(); render();
  };
  div.querySelector('[data-act="editar"]').onclick = ()=>abrirHoja(t);
  div.querySelector('[data-act="duplicar"]').onclick = ()=>{ duplicar(t.id); };
  div.querySelector('[data-act="borrar"]').onclick = ()=>{ borrar(t.id); };
  div.querySelectorAll('[data-act="sub"]').forEach(b=>{
    b.onclick = ()=>{
      const s = subs.find(x=>x.id===b.dataset.sub);
      if(s){ s.hecha = !s.hecha; vibrar(); guardar(); render(); }
    };
  });
  return div;
}

function anadir(padre, hijo){ if(hijo) padre.appendChild(hijo); }
function bloqueVacio(mensaje){
  const d = document.createElement("div");
  d.className = "vacia";
  d.innerHTML = ico("bandeja") + '<p>' + esc(mensaje) + '</p>';
  return d;
}
function grupo(titulo, lista, opcionVacio, idDia){
  const cont = document.createElement("div");
  cont.className = "bloque";
  const cab = document.createElement("div");
  cab.className = "bloque-titulo";
  cab.innerHTML = '<h2>'+esc(titulo)+'</h2><span class="num">'+lista.length+'</span>';
  if(idDia){
    const mas = document.createElement("button");
    mas.className = "enlace"; mas.type = "button"; mas.textContent = "+ añadir";
    mas.onclick = ()=>abrirHoja(null, idDia);
    cab.appendChild(document.createElement("span")).className = "espacio";
    cab.appendChild(mas);
  }
  cont.appendChild(cab);
  if(!lista.length){
    if(opcionVacio===false) return null;
    const v = document.createElement("div");
    v.className = "vacia"; v.style.padding = "14px 6px";
    v.innerHTML = '<p style="font-size:.85rem">'+esc(typeof opcionVacio==="string" ? opcionVacio : "Nada por aquí")+'</p>';
    cont.appendChild(v);
    return cont;
  }
  const l = document.createElement("div");
  l.className = "lista";
  lista.forEach(t=>l.appendChild(tarjeta(t)));
  cont.appendChild(l);
  return cont;
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  renderRecuento();
  renderPistas();
  if(vista.modo==="hoy") renderHoy(app);
  else if(vista.modo==="lista") renderLista(app);
  else renderSemana(app);
}

function renderRecuento(){
  const pendientes = tareas.filter(t=>t.estado!=="completada");
  const hoy = pendientes.filter(t=>t.fecha && diasHasta(t.fecha)===0).length;
  const venc = pendientes.filter(esVencida).length;
  const sinFecha = pendientes.filter(t=>!t.fecha).length;
  const hechas = tareas.filter(t=>t.estado==="completada").length;
  document.getElementById("recuento").innerHTML =
      '<span class="cuenta">Hoy <b>'+hoy+'</b></span>'
    + '<span class="cuenta'+(venc?" alerta":"")+'">Vencidas <b>'+venc+'</b></span>'
    + '<span class="cuenta">Sin fecha <b>'+sinFecha+'</b></span>'
    + '<span class="cuenta">Hechas <b>'+hechas+'</b></span>';
}

function renderPistas(){
  const c = document.getElementById("pistas");
  c.innerHTML = "";
  const etiquetas = [...new Set(tareas.flatMap(t=>t.etiquetas))].sort((a,b)=>a.localeCompare(b,"es"));
  const bTodas = document.createElement("button");
  bTodas.className = "pista"+(vista.etiqueta===null?" activa":"");
  bTodas.textContent = "Todas";
  bTodas.onclick = ()=>{ vista.etiqueta=null; render(); };
  c.appendChild(bTodas);
  etiquetas.forEach(e=>{
    const b = document.createElement("button");
    b.className = "pista"+(vista.etiqueta===e?" activa":"");
    b.innerHTML = '<span class="punto" style="background:'+colorDeTag(e)+'"></span># '+esc(e);
    b.onclick = ()=>{ vista.etiqueta = vista.etiqueta===e ? null : e; render(); };
    c.appendChild(b);
  });
}

function renderHoy(app){
  const pend = filtrar(tareas.filter(t=>t.estado!=="completada"));
  const vencidas = pend.filter(esVencida);
  const deHoy = pend.filter(t=>t.fecha && diasHasta(t.fecha)===0 && !esVencida(t));
  const manana = pend.filter(t=>t.fecha && diasHasta(t.fecha)===1);
  const total = tareas.length;
  const hechas = tareas.filter(t=>t.estado==="completada").length;
  const pct = total ? Math.round(hechas/total*100) : 0;

  const prog = document.createElement("div");
  prog.className = "progreso-global";
  prog.innerHTML = '<div class="fila"><span class="gran">'+pct+'%</span>'
    + '<span class="det">'+hechas+' de '+total+' tareas completadas</span></div>'
    + '<div class="barra"><div style="width:'+pct+'%"></div></div>';
  const dias = document.createElement("div");
  dias.className = "dias";
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const clave = aStr(d);
    const n = tareas.filter(t=>t.estado==="completada" && claveLocalDe(t.completadaEl)===clave).length;
    const maxHoy = Math.max(1, ...Array.from({length:7}, (_,k)=>{
      const dd = new Date(); dd.setDate(dd.getDate()-(6-k));
      return tareas.filter(t=>t.estado==="completada" && claveLocalDe(t.completadaEl)===aStr(dd)).length;
    }));
    dias.innerHTML += '<div class="d'+(i===0?" hoy":"")+'" title="'+n+' completadas el '+clave+'">'
      + '<div class="barr" style="height:'+Math.round(n/maxHoy*30)+'px;'+(n?"":"opacity:.15")+'"></div>'
      + '<span class="lbl">'+DIAS_CORTO[diaSemana(d)]+'</span></div>';
  }
  prog.appendChild(dias);
  app.appendChild(prog);

  if(vencidas.length) anadir(app, grupo("Vencidas", vencidas, false));
  anadir(app, grupo("Hoy", deHoy, "Nada para hoy. Descansa o avanza alguna de otra fecha."));
  anadir(app, grupo("Mañana", manana, false));
  const despues = pend.filter(t=>t.fecha && diasHasta(t.fecha)>1);
  anadir(app, grupo("Después", despues, false));
  const sinF = pend.filter(t=>!t.fecha);
  anadir(app, grupo("Sin fecha", sinF, "Todo colocado. Aquí caen las tareas sin día."));
  const hoyHechas = filtrar(tareas.filter(t=>t.estado==="completada" && claveLocalDe(t.completadaEl)===hoyStr()));
  if(hoyHechas.length) anadir(app, grupo("Completadas hoy", hoyHechas, false));
}

function renderLista(app){
  const pend = filtrar(tareas.filter(t=>t.estado!=="completada"));
  const done = filtrar(tareas.filter(t=>t.estado==="completada"));
  if(!tareas.length){ app.appendChild(bloqueVacio("Aún no hay tareas. Pulsa el botón + para crear la primera.")); return; }
  anadir(app, grupo("Por hacer ("+pend.length+")", pend, "No queda nada pendiente."));
  if(done.length) anadir(app, grupo("Completadas ("+done.length+")", done, false));
}

function renderSemana(app){
  const lunes = new Date();
  lunes.setDate(lunes.getDate() - diaSemana(new Date()) + calSemanaOffset*7);
  lunes.setHours(0,0,0,0);
  const domingo = new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate()+6);
  const cab = document.createElement("div");
  cab.className = "cal-cab";
  const rango = (lunes.getDate()===1 && lunes.getMonth()!==domingo.getMonth())
    ? MESES[lunes.getMonth()]+" "+lunes.getFullYear()
    : lunes.getDate()+" "+MESES[lunes.getMonth()]+" → "+domingo.getDate()+" "+MESES[domingo.getMonth()];
  cab.innerHTML = '<button class="icon-btn" id="sAtras" aria-label="Semana anterior">'+ico("atras")+'</button>'
    + '<span class="rango">'+esc(rango)+'</span>'
    + '<button class="icon-btn" id="sAdel" aria-label="Semana siguiente">'+ico("adelante")+'</button>';
  app.appendChild(cab);

  const todas = filtrar(tareas);
  for(let i=0;i<7;i++){
    const d = new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate()+i);
    const clave = aStr(d);
    const delDia = todas.filter(t=>t.fecha===clave);
    const cont = document.createElement("div");
    cont.className = "cal-dia"+(d.getMonth()!==lunes.getMonth()?"":"");
    cont.innerHTML = '<div class="cal-dia-cab'+(clave===hoyStr()?" hoy":"")+'">'
      + '<span class="nombre">'+DIAS_LARGO[i]+'</span>'
      + '<span class="num">'+d.getDate()+' '+MESES[d.getMonth()]+'</span></div>';
    const masBtn = document.createElement("button");
    masBtn.className = "mas"; masBtn.type = "button"; masBtn.textContent = "+ añadir";
    masBtn.onclick = ()=>abrirHoja(null, clave);
    cont.querySelector(".cal-dia-cab").appendChild(masBtn);
    if(delDia.length){
      const l = document.createElement("div"); l.className = "lista";
      delDia.forEach(t=>l.appendChild(tarjeta(t)));
      cont.appendChild(l);
    }
    app.appendChild(cont);
  }
  const sinF = todas.filter(t=>!t.fecha);
  const caja = document.createElement("div");
  caja.className = "sinfecha";
  caja.innerHTML = '<h3>Sin fecha ('+sinF.length+')</h3>';
  if(sinF.length){
    const l = document.createElement("div"); l.className = "lista";
    sinF.forEach(t=>l.appendChild(tarjeta(t)));
    caja.appendChild(l);
  }else{
    caja.innerHTML += '<p style="font-size:.83rem;color:var(--soft)">Ninguna tarea sin día.</p>';
  }
  app.appendChild(caja);
  document.getElementById("sAtras").onclick = ()=>{ calSemanaOffset--; render(); };
  document.getElementById("sAdel").onclick = ()=>{ calSemanaOffset++; render(); };
}

/* ---------- Acciones ---------- */
function borrar(id){
  const i = tareas.findIndex(x=>x.id===id);
  if(i<0) return;
  ultimoBorrado = { tarea: tareas[i], indice: i };
  tareas.splice(i,1); guardar(); render();
  avisar("Tarea borrada", true);
}
function duplicar(id){
  const i = tareas.findIndex(x=>x.id===id);
  if(i<0) return;
  const copia = JSON.parse(JSON.stringify(tareas[i]));
  copia.id = uid();
  copia.titulo = tareas[i].titulo + " (copia)";
  copia.creadaEl = Date.now();
  if(copia.estado==="completada"){ copia.estado="pendiente"; copia.completadaEl=null; }
  copia.cronometro = {segundos:0, activo:false};
  copia.subtareas = (copia.subtareas||[]).map(s=>({id:uid(), texto:s.texto, hecha:false}));
  tareas.splice(i+1, 0, copia);
  guardar(); render();
  avisar("Tarea duplicada", false);
}

/* ---------- Hoja (formulario) ---------- */
const hoja = document.getElementById("hoja");
function marcarPrio(){
  document.querySelectorAll("#prioSeg button").forEach(b=>{
    b.className = b.dataset.p===formPrio ? "on-"+formPrio : "";
  });
}
function renderTagsForm(){
  const c = document.getElementById("tagsForm");
  c.innerHTML = "";
  formTags.forEach(tag=>{
    const chip = document.createElement("span");
    chip.className = "chip-tag"; chip.style.background = colorDeTag(tag);
    chip.textContent = tag;
    const col = document.createElement("button");
    col.type = "button"; col.className = "color"; col.title = "Cambiar color";
    col.style.background = coloresTag[tag];
    col.onclick = ()=>{
      const i = PALETA.indexOf(coloresTag[tag]);
      coloresTag[tag] = PALETA[(i+1)%PALETA.length]; guardar(); renderTagsForm(); render();
    };
    const x = document.createElement("button");
    x.type = "button"; x.innerHTML = ico("cerrar"); x.setAttribute("aria-label","Quitar etiqueta");
    x.onclick = ()=>{ formTags = formTags.filter(t=>t!==tag); renderTagsForm(); };
    chip.appendChild(col); chip.appendChild(x);
    c.appendChild(chip);
  });
}
function renderSubsForm(){
  const c = document.getElementById("subsForm");
  c.innerHTML = "";
  formSubs.forEach(s=>{
    const fila = document.createElement("div");
    fila.className = "fila-sub"+(s.hecha?" on":"");
    const cuad = document.createElement("button");
    cuad.type = "button"; cuad.className = "cuad"; cuad.innerHTML = ico("check");
    cuad.setAttribute("aria-label","Marcar paso");
    cuad.onclick = ()=>{ s.hecha = !s.hecha; renderSubsForm(); };
    const txt = document.createElement("span");
    txt.className = "txt"; txt.textContent = s.texto;
    const x = document.createElement("button");
    x.type = "button"; x.className = "x"; x.innerHTML = ico("cerrar"); x.setAttribute("aria-label","Quitar paso");
    x.onclick = ()=>{ formSubs = formSubs.filter(z=>z.id!==s.id); renderSubsForm(); };
    fila.appendChild(cuad); fila.appendChild(txt); fila.appendChild(x);
    c.appendChild(fila);
  });
}
function recordatorioInvalido(){
  const f = document.getElementById("fFecha").value;
  const r = document.getElementById("fRecordatorio").value;
  if(!f || !r) return false;
  return r.slice(0,10) > f;
}
function pintarErrorRecordatorio(){
  const mal = recordatorioInvalido();
  document.getElementById("fRemError").classList.toggle("visible", mal);
  document.getElementById("fRecordatorio").classList.toggle("con-error", mal);
  return mal;
}
function abrirHoja(t, fechaInicial){
  editandoId = t ? t.id : null;
  document.getElementById("hojaTitulo").textContent = t ? "Editar tarea" : "Nueva tarea";
  document.getElementById("fTitulo").value = t ? t.titulo : "";
  document.getElementById("fDesc").value = t ? t.descripcion : "";
  document.getElementById("fFecha").value = t ? t.fecha : (fechaInicial||"");
  document.getElementById("fRecordatorio").value = t ? t.recordatorio : "";
  document.getElementById("fRecur").value = t ? t.recur : "no";
  formPrio = t ? t.prioridad : "media";
  formTags = t ? t.etiquetas.slice() : [];
  formSubs = t ? JSON.parse(JSON.stringify(t.subtareas||[])) : [];
  document.getElementById("btnBorrarHoja").style.display = t ? "" : "none";
  marcarPrio(); renderTagsForm(); renderSubsForm(); pintarErrorRecordatorio();
  hoja.showModal();
  if(!t) setTimeout(()=>document.getElementById("fTitulo").focus(), 120);
}
document.getElementById("fab").onclick = ()=>abrirHoja(null);
document.getElementById("btnCerrarHoja").onclick = ()=>hoja.close();
document.getElementById("btnBorrarHoja").innerHTML = ico("papelera");
document.getElementById("btnBorrarHoja").onclick = ()=>{
  if(editandoId){ const id = editandoId; hoja.close(); borrar(id); }
};
document.querySelectorAll("#prioSeg button").forEach(b=>{
  b.onclick = ()=>{ formPrio = b.dataset.p; marcarPrio(); };
});
document.querySelectorAll("#sugFecha button").forEach(b=>{
  b.onclick = ()=>{
    const inp = document.getElementById("fFecha");
    if(b.dataset.d===""){ inp.value = ""; }
    else{
      const d = new Date(); d.setDate(d.getDate()+Number(b.dataset.d));
      inp.value = aStr(d);
    }
    pintarErrorRecordatorio();
  };
});
document.getElementById("fFecha").addEventListener("change", ()=>{
  // Si el recordatorio quedó en un día posterior, se arrastra al mismo día de la fecha límite
  const f = document.getElementById("fFecha").value;
  const r = document.getElementById("fRecordatorio");
  if(f && r.value && r.value.slice(0,10) > f) r.value = f + r.value.slice(10);
  pintarErrorRecordatorio();
});
document.getElementById("fRecordatorio").addEventListener("change", pintarErrorRecordatorio);
document.getElementById("fTagInput").addEventListener("keydown", ev=>{
  if(ev.key==="Enter" || ev.key===","){
    ev.preventDefault();
    const v = ev.target.value.trim().toLowerCase();
    if(v && !formTags.includes(v)){ formTags.push(v); colorDeTag(v); }
    ev.target.value = ""; renderTagsForm();
  }
});
document.getElementById("fSubInput").addEventListener("keydown", ev=>{
  if(ev.key==="Enter"){ ev.preventDefault(); agregarSub(); }
});
document.getElementById("btnAddSub").onclick = agregarSub;
function agregarSub(){
  const inp = document.getElementById("fSubInput");
  const texto = inp.value.trim();
  if(!texto) return;
  formSubs.push({id:uid(), texto, hecha:false});
  inp.value = ""; renderSubsForm(); inp.focus();
}
document.getElementById("formulario").addEventListener("submit", ev=>{
  ev.preventDefault();
  const titulo = document.getElementById("fTitulo").value.trim();
  if(!titulo){ avisar("Ponle un título a la tarea."); return; }
  if(pintarErrorRecordatorio()){ avisar("El recordatorio va después de la fecha límite."); return; }
  const pendienteTag = document.getElementById("fTagInput").value.trim().toLowerCase();
  if(pendienteTag && !formTags.includes(pendienteTag)){ formTags.push(pendienteTag); colorDeTag(pendienteTag); }
  const datos = {
    titulo,
    descripcion: document.getElementById("fDesc").value.trim(),
    prioridad: formPrio,
    fecha: document.getElementById("fFecha").value || "",
    recordatorio: document.getElementById("fRecordatorio").value || "",
    recur: document.getElementById("fRecur").value,
    etiquetas: formTags.slice(),
    subtareas: formSubs.slice()
  };
  const estadoForm = editandoId ? (tareas.find(x=>x.id===editandoId)||{estado:"pendiente"}).estado : "pendiente";
  if(editandoId){
    const t = tareas.find(x=>x.id===editandoId);
    if(t){ Object.assign(t, datos); t.estado = estadoForm; }
  }else{
    tareas.push(Object.assign({id:uid(), estado:"pendiente", creadaEl:Date.now(), completadaEl:null, cronometro:{segundos:0, activo:false}}, datos));
  }
  guardar(); hoja.close(); render();
  avisar(editandoId ? "Tarea actualizada" : "Tarea añadida", false);
});

/* ---------- Navegación ---------- */
function setTab(modo){
  vista.modo = modo;
  document.getElementById("tabHoy").classList.toggle("activa", modo==="hoy");
  document.getElementById("tabLista").classList.toggle("activa", modo==="lista");
  document.getElementById("tabSemana").classList.toggle("activa", modo==="semana");
  try{ localStorage.setItem(CLAVE_VISTA, JSON.stringify({modo})); }catch(e){}
  render();
  window.scrollTo(0,0);
}

/* Atajos desde el manifest de la PWA (#nueva, #hoy): sirven también al inicarse el navegador en esa URL */
function atenderHash(){
  const h = location.hash;
  if(h==="#nueva"){ history.replaceState(null,"",location.pathname+location.search); abrirHoja(null,null); }
  else if(h==="#hoy"){ history.replaceState(null,"",location.pathname+location.search); setTab("hoy"); }
}
window.addEventListener("hashchange", atenderHash);
document.getElementById("tabHoy").onclick = ()=>setTab("hoy");
document.getElementById("tabLista").onclick = ()=>setTab("lista");
document.getElementById("tabSemana").onclick = ()=>setTab("semana");
document.getElementById("buscar").addEventListener("input", ev=>{ vista.busqueda = ev.target.value.trim(); render(); });
document.getElementById("filtroPrio").addEventListener("change", ev=>{ vista.prioridad = ev.target.value; render(); });

/* ---------- Tema ---------- */
function aplicarTema(tema){
  document.documentElement.dataset.tema = tema==="oscuro" ? "oscuro" : "";
  const boton = document.getElementById("btnTema");
  boton.innerHTML = ico(tema==="oscuro" ? "sol" : "luna");
  const meta = document.querySelector('meta[name="theme-color"][media*="dark"]');
  if(meta) meta.setAttribute("content", "#0b1220");
}
document.getElementById("btnTema").onclick = ()=>{
  const oscuro = document.documentElement.dataset.tema==="oscuro";
  const nuevo = oscuro ? "claro" : "oscuro";
  try{ localStorage.setItem(CLAVE_TEMA, nuevo); }catch(e){}
  aplicarTema(nuevo);
};

/* ---------- Avisos y vibración ---------- */
let avisoTimer = null;
function avisar(texto, conDeshacer){
  document.getElementById("avisoTexto").textContent = texto;
  const boton = document.getElementById("avisoAccion");
  boton.classList.toggle("oculto", !conDeshacer);
  document.getElementById("aviso").classList.add("visible");
  clearTimeout(avisoTimer);
  avisoTimer = setTimeout(()=>document.getElementById("aviso").classList.remove("visible"), 4800);
}
document.getElementById("avisoAccion").onclick = ()=>{
  if(ultimoBorrado){
    tareas.splice(Math.min(ultimoBorrado.indice, tareas.length), 0, ultimoBorrado.tarea);
    ultimoBorrado = null; guardar(); render();
  }
  document.getElementById("aviso").classList.remove("visible");
};
function vibrar(){ if(navigator.vibrate) try{ navigator.vibrate(14); }catch(e){} }

/* ---------- Copias (JSON) ---------- */
const hojaCopias = document.getElementById("hojaCopias");
document.getElementById("btnCopias").innerHTML = ico("guardar");
document.getElementById("btnCopias").onclick = ()=>hojaCopias.showModal();
document.getElementById("btnCerrarCopias").onclick = ()=>{
  hojaCopias.close();
  document.getElementById("areaPegar").classList.add("oculto");
};
document.getElementById("btnPegarCopia").onclick = ()=>{
  document.getElementById("areaPegar").classList.toggle("oculto");
};
document.getElementById("btnGuardarCopia").onclick = async ()=>{
  const texto = JSON.stringify(tareas, null, 2);
  const nombre = "mis-tareas-mini-"+hoyStr()+".json";
  if(esNativo){
    try{
      const F = window.Capacitor.Plugins.Filesystem;
      const res = await F.writeFile({ path: nombre, data: textoBase64(texto), directory: "DOCUMENTS", recursive: true });
      const S = window.Capacitor.Plugins.Share;
      if(S && res && res.uri){
        try{ await S.share({ title:"Copia Mis Tareas", dialogTitle:"Guardar copia", files:[res.uri] }); }
        catch(e){ /* el usuario canceló el menú de compartir */ }
      }
      avisar("Copia guardada en la app: "+nombre, false);
    }catch(e){ avisar("No se pudo guardar la copia: "+e); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([texto], {type:"application/json"}));
  a.download = nombre;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  avisar("Copia descargada: "+nombre, false);
};
document.getElementById("btnCargarCopia").onclick = ()=>document.getElementById("archivoCopia").click();
document.getElementById("archivoCopia").addEventListener("change", ()=>{
  const f = document.getElementById("archivoCopia").files[0];
  if(!f) return;
  const l = new FileReader();
  l.onload = ()=>importarDesdeTexto(String(l.result));
  l.readAsText(f);
  document.getElementById("archivoCopia").value = "";
});
function textoBase64(texto){
  const bytes = new TextEncoder().encode(texto);
  let bin = "";
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function importarDesdeTexto(texto){
  try{
    const datos = JSON.parse(texto);
    const lista = Array.isArray(datos) ? datos : (datos && Array.isArray(datos.tareas) ? datos.tareas : null);
    if(!lista) throw new Error("formato");
    const limpias = lista.filter(t=>t && typeof t.titulo==="string").map(normalizar);
    if(!limpias.length) throw new Error("vacío");
    limpias.forEach(t=>t.etiquetas.forEach(colorDeTag));
    if(!confirm("Se cargarán "+limpias.length+" tareas y se sustituirán las "+tareas.length+" actuales. ¿Continuar?")) return;
    tareas = limpias;
    coloresTag = (datos && datos.coloresTag) ? datos.coloresTag : {};
    guardar(); render();
    hojaCopias.close();
    avisar("Copias cargadas: "+limpias.length+" tareas", false);
  }catch(e){ avisar("Ese archivo no es una copia válida de Mis Tareas."); }
}
document.getElementById("areaPegar").addEventListener("blur", ()=>{
  const texto = document.getElementById("areaPegar").value.trim();
  if(texto.length>2) importarDesdeTexto(texto);
});

/* ---------- Recordatorios (avisos dentro de la app) ---------- */
function avisosHechos(){ try{ return new Set(JSON.parse(localStorage.getItem(CLAVE_AVISADOS)||"[]")); }catch(e){ return new Set(); } }
function guardarAvisos(set){ try{ localStorage.setItem(CLAVE_AVISADOS, JSON.stringify([...set].slice(-300))); }catch(e){} }
async function revisarRecordatorios(){
  const ahora = new Date();
  const set = avisosHechos();
  let cambio = false;
  for(const t of tareas){
    if(!t.recordatorio || t.estado==="completada") continue;
    const clave = t.id+"|"+t.recordatorio;
    if(set.has(clave)) continue;
    if(new Date(t.recordatorio) <= ahora){
      set.add(clave); cambio = true;
      avisar("Recordatorio: "+t.titulo, false);
      vibrar();
      if(!esNativo && "Notification" in window && Notification.permission==="granted"){
        try{ new Notification("Recordatorio: "+t.titulo, { body: t.descripcion || "Tienes una tarea pendiente." }); }catch(e){}
      }
    }
  }
  if(cambio) guardarAvisos(set);
}
setInterval(revisarRecordatorios, 30000);

/* ---------- Arranque ---------- */
function iniciar(){
  document.getElementById("icoBuscar").innerHTML = ico("buscar");
  document.getElementById("fab").innerHTML = ico("mas");
  document.getElementById("tabHoy").innerHTML = ico("hoy")+"<span>Hoy</span>";
  document.getElementById("tabLista").innerHTML = ico("lista")+"<span>Lista</span>";
  document.getElementById("tabSemana").innerHTML = ico("semana")+"<span>Semana</span>";
  document.getElementById("icoGuardar").innerHTML = ico("guardar");
  document.getElementById("icoCargar").innerHTML = ico("abrir");
  document.getElementById("icoPegar").innerHTML = ico("texto");

  const datos = cargar();
  tareas = datos.tareas;
  coloresTag = datos.coloresTag;
  try{
    const v = JSON.parse(localStorage.getItem(CLAVE_VISTA)||"null");
    if(v && ["hoy","lista","semana"].includes(v.modo)) vista.modo = v.modo;
  }catch(e){}
  let tema = "claro";
  try{ tema = localStorage.getItem(CLAVE_TEMA) || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro"); }catch(e){}
  aplicarTema(tema);
  setTab(vista.modo);
  atenderHash();
  revisarRecordatorios();
  if(!esNativo && "Notification" in window && Notification.permission==="default"){
    // Se pide solo cuando el usuario toca una tarea con recordatorio: lo hacemos discreto al arrancar
    setTimeout(()=>{ try{ Notification.requestPermission(); }catch(e){} }, 1200);
  }
}
iniciar();

/* ---------- PWA (solo navegador) ---------- */
if("serviceWorker" in navigator && !esNativo && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(e=>console.warn("SW no registrado:", e));
  });
}
